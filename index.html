<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>拼豆工坊 · Perler Studio</title>
<script src="./templates.js"></script>
<script src="./designs.js"></script>
<style>
:root{
  /* 小清新 · 手作拼豆 治愈色系 */
  --paper:#FBF6EE;        /* 暖纸米底 */
  --paper-2:#F6EEDF;      /* 略深的纸色 */
  --card:#FFFFFF;         /* 卡片面 */
  --card-2:#FDF8EF;       /* 柔和副面 */
  --ink:#3E3730;          /* 温润墨色（非纯黑） */
  --ink-2:#93877B;        /* 次要文字，暖灰 */
  --ink-3:#B5A797;
  --line:#EEE3D2;         /* 细细的米线 */
  --line-soft:#F4EBDC;
  /* 主色：薄荷 + 浆果（少而精，留白给纸面） */
  --mint:#67C6B4;         /* 主操作 */
  --mint-deep:#36A08F;
  --mint-soft:#DDF1EB;
  --berry:#EF6A5B;        /* CTA / 强调 */
  --berry-deep:#D84E42;
  --berry-soft:#FCE6E1;
  /* 点缀粉彩（小面积） */
  --rose:#F3AFA0;
  --sky:#9FD0EC;
  --sky-soft:#E4F0FA;
  --sprout:#A9CF96;
  --sprout-soft:#EBF4E3;
  --lemon:#F3D77F;
  --plum:#A68FBE;
  --plum-soft:#EFE9F6;
  --shadow:0 1px 2px rgba(134,110,84,.06), 0 6px 20px rgba(134,110,84,.07);
  --shadow-hover:0 4px 8px rgba(134,110,84,.08), 0 14px 34px rgba(134,110,84,.12);
  --r:18px; --r-sm:12px;
  --sp-4:4px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-24:24px;
  --ff:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','HanziPen SC',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:var(--ff);color:var(--ink);
  background:
     radial-gradient(rgba(150,125,95,.06) 1.1px, transparent 1.5px) 0 0 / 22px 22px,
     var(--paper);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input{font-family:inherit;}
body.no-scroll{overflow:hidden;}

/* ---------- Header ---------- */
header{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; padding:12px 20px;
  background:rgba(251,246,238,.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft); box-shadow:0 1px 0 rgba(255,255,255,.6) inset;}
.brand{display:flex; align-items:center; gap:11px;}
.brand-logo{width:40px;height:40px;border-radius:13px; display:grid;grid-template-columns:repeat(2,1fr);padding:6px;gap:3px;
  background:#fff; border:1px solid var(--line); box-shadow:var(--shadow);}
.brand-logo i{width:100%;height:100%;border-radius:50%; box-shadow:inset 0 -2px 3px rgba(0,0,0,.10);}
.brand-logo i:nth-child(1){background:var(--mint);} .brand-logo i:nth-child(2){background:var(--rose);}
.brand-logo i:nth-child(3){background:var(--lemon);} .brand-logo i:nth-child(4){background:var(--sky);}
.brand h1{font-size:19px; margin:0; letter-spacing:1px; font-weight:800; color:var(--ink);}
.brand small{display:block; font-size:11px; color:var(--ink-2); font-weight:400; letter-spacing:.4px;}
.hd-actions{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.iconbtn{display:inline-flex; align-items:center;gap:6px; padding:8px 12px; border-radius:999px; background:#fff;
  border:1px solid var(--line); color:var(--ink); font-size:13px; font-weight:600; transition:.16s;}
.iconbtn:hover{border-color:var(--mint); color:var(--mint-deep); transform:translateY(-1px); box-shadow:var(--shadow);}
.iconbtn:disabled{opacity:.4; cursor:not-allowed; transform:none;}
.iconbtn svg{width:16px;height:16px;}
.btn-export{background:var(--berry); border-color:var(--berry); color:#fff;
  box-shadow:0 6px 16px -6px rgba(216,78,66,.55);}
.btn-export:hover{background:var(--berry-deep); border-color:var(--berry-deep); color:#fff; filter:none;}
.size-ctl{display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink-2); flex-wrap:wrap;}
.size-ctl .s-mini{display:flex; align-items:center; gap:3px; font-weight:600; color:var(--ink-3); font-size:12px;}
.size-ctl input{width:48px; border:1px solid var(--line); border-radius:9px; padding:4px 6px; text-align:center; font-size:13px; font-weight:700; color:var(--ink); background:var(--card-2);}
.size-ctl .s-mini input{width:44px;}
.size-ctl .s-x{color:var(--ink-3); font-weight:700;}

/* ---------- Layout ---------- */
.wrap{display:grid; grid-template-columns:296px minmax(0,1fr) 360px; gap: var(--sp-16); padding:var(--sp-16); align-items:start; max-width:1600px; margin:0 auto;}
.panel{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden;}
.panel-h{display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--line-soft); font-weight:800; font-size:14px; letter-spacing:.3px;}
.panel-h .dot{width:9px;height:9px;border-radius:50%; box-shadow:inset 0 -2px 2px rgba(0,0,0,.12);}
.panel-b{padding:var(--sp-16);}

/* ---------- Tools ---------- */
.tool-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.tool{display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px; border-radius:14px; background:var(--card-2);
  border:1px solid var(--line-soft); font-size:11px; font-weight:600; color:var(--ink-2); transition:.16s; position:relative;}
.tool .ico{width:34px;height:34px; border-radius:11px; display:grid; place-items:center; background:#fff; border:1px solid var(--line-soft);}
.tool svg{width:20px;height:20px;}
.tool:hover{border-color:var(--mint); color:var(--mint-deep);}
.tool.active{background:var(--mint); color:#fff; border-color:var(--mint); box-shadow:0 6px 14px -6px rgba(54,160,143,.5);}
.tool.active .ico{background:rgba(255,255,255,.24); border-color:transparent;}
.tool.active .ico svg{color:#fff;}
.sym-row{display:flex; gap:6px; margin-top:10px;}
.sym{flex:1; padding:7px 0; border-radius:999px; border:1px solid var(--line-soft); background:var(--card-2); font-size:12px; font-weight:600; color:var(--ink-2); transition:.16s;}
.sym:hover{border-color:var(--mint);}
.sym.active{background:var(--mint-soft); border-color:var(--mint); color:var(--mint-deep);}

/* ---------- Palette ---------- */
.pal-grp{margin-bottom:12px;}
.pal-grp h4{margin:0 0 7px; font-size:11px; color:var(--ink-2); letter-spacing:1px; font-weight:700;}
.swatches{display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:9px;}
.sw{position:relative; aspect-ratio:1; border-radius:50%; border:2px solid #fff; cursor:pointer; transition:.12s;
  box-shadow:0 0 0 1px var(--line), inset 0 -4px 6px rgba(0,0,0,.08);}
.sw:hover{transform:scale(1.12); z-index:2;}
.sw.selected{outline:2.5px solid var(--berry); outline-offset:2px; transform:scale(1.1);}
.sw .sw-code{position:absolute; left:50%; bottom:1px; transform:translateX(-50%); font-size:8px; font-weight:800; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.55); letter-spacing:.4px; white-space:nowrap;}
.curbar{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:14px; background:var(--card-2); border:1px solid var(--line-soft); margin-bottom:10px;}
.cur-swatch{width:34px;height:34px;border-radius:50%; flex:none; box-shadow:0 0 0 1px var(--line), inset 0 -4px 7px rgba(0,0,0,.14);}
.cur-meta{font-size:12px;}
.cur-meta b{font-size:13px;}
.cur-meta span{color:var(--ink-2); font-size:11px; display:block;}

/* ---------- Canvas center ---------- */
.stage{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden;}
.stage-toolbar{display:flex; align-items:center; gap:6px; padding:10px 14px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap;}
.stage-actions{margin-left:auto; display:flex; gap:5px;}
.stage-info{display:flex; gap:6px; align-items:center; padding:11px 14px; border-top:1px solid var(--line-soft); color:var(--ink-2); font-size:12px; flex-wrap:wrap;}
.stage-info .pill{background:var(--card-2); border:1px solid var(--line-soft); padding:4px 10px; border-radius:999px; font-weight:600; color:var(--ink-2);}
.stage-info b{color:var(--berry-deep);}
.canvas-zone{position:relative; padding: var(--sp-24); display:grid; place-items:center; min-height:440px;
  background:
    radial-gradient(circle, rgba(160,140,115,.14) 0.5px, transparent 1.4px) 0 0 / 18px 18px,
    #FFFDF7;}
#board{max-width:100%; max-height:66vh; image-rendering:pixelated; touch-action:none; cursor:crosshair; border-radius:10px;
  box-shadow:0 2px 3px rgba(90,70,45,.06), 0 0 0 1px rgba(90,70,45,.05); background:#fff;}
.empty-hint{position:absolute; inset:0; display:grid; place-items:center; color:var(--ink-2); font-size:14px; pointer-events:none; display:none;}

/* ---------- Right tabs ---------- */
.tabs{display:flex; gap:4px; padding:8px; background:var(--card-2); border-bottom:1px solid var(--line-soft); overflow-x:auto;}
.tab{flex:1; min-width:72px; padding:8px 6px; border-radius:999px; font-size:12px; font-weight:700; color:var(--ink-2); white-space:nowrap; text-align:center; transition:.16s;}
.tab:hover{color:var(--ink);}
.tab.active{background:#fff; color:var(--berry); box-shadow:0 2px 6px rgba(120,100,70,.10); border:1px solid var(--line-soft);}
.tabbody{display:none; padding:var(--sp-16);}
.tabbody.active{display:block;}
.sect{margin-bottom:18px;}
.sect:last-child{margin-bottom:0;}
.sect h4{margin:0 0 10px; font-size:13px; display:flex; align-items:center; gap:6px; color:var(--ink);}
.cats{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.cat-chip{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; background:var(--card-2); border:1px solid var(--line-soft); color:var(--ink-2); transition:.16s;}
.cat-chip:hover{border-color:var(--mint); color:var(--mint-deep);}
.cat-chip.active{background:var(--mint); color:#fff; border-color:var(--mint); box-shadow:0 5px 12px -6px rgba(54,160,143,.5);}
.tpl-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.tpl{background:var(--card-2); border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; cursor:pointer; transition:.16s; text-align:center; padding-bottom:6px;}
.tpl:hover{border-color:var(--mint); transform:translateY(-3px); box-shadow:var(--shadow-hover);}
.tpl canvas{width:100%; display:block; image-rendering:pixelated; background:#fff;}
.tpl img{width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#fff;}
.tpl .tname{font-size:11px; padding:7px 4px 2px; font-weight:600; color:var(--ink-2);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 14px; border-radius:999px; font-size:13px; font-weight:700; transition:.16s;}
.btn-primary{background:var(--mint); color:#fff; width:100%; box-shadow:0 6px 16px -6px rgba(54,160,143,.5);}
.btn-primary:hover{background:var(--mint-deep);}
.btn-ghost{background:var(--card-2); border:1px solid var(--line-soft); color:var(--ink);}
.btn-ghost:hover{border-color:var(--mint); color:var(--mint-deep); background:#fff;}
.row{display:flex; gap:8px;}
.row>*{flex:1;}
.emoji-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; max-height:300px; overflow:auto; padding:2px;}
.emoji-grid button{aspect-ratio:1; font-size:24px; border-radius:12px; background:var(--card-2); border:1px solid var(--line-soft); display:grid; place-items:center; transition:.14s;}
.emoji-grid button:hover{background:#fff; transform:scale(1.1); box-shadow:var(--shadow);}
.seg{display:flex; gap:4px; padding:4px; background:var(--card-2); border:1px solid var(--line-soft); border-radius:999px; margin-bottom:10px;}
.seg button{flex:1; padding:7px 6px; border-radius:999px; font-size:12px; font-weight:700; color:var(--ink-2); transition:.16s;}
.seg button:hover{color:var(--ink);}
.seg button.active{background:#fff; box-shadow:0 2px 6px rgba(120,100,70,.12); color:var(--berry); border:1px solid var(--line-soft);}
.lbl{font-size:12px; font-weight:700; margin:10px 0 6px; color:var(--ink-2); display:block;}
.textinput{width:100%; padding:11px 13px; border-radius:14px; border:1.5px solid var(--line); font-size:15px; font-weight:600; letter-spacing:.5px; background:var(--card-2); transition:.16s; color:var(--ink);}
.textinput:focus{outline:none; border-color:var(--mint); background:#fff; box-shadow:0 0 0 3px var(--mint-soft);}
.mini-note{font-size:11px; color:var(--ink-2); margin-top:8px; text-align:center; line-height:1.6;}
#fileInput{display:none;}

/* ---------- Modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(120,100,80,.30); backdrop-filter:blur(4px); z-index:60; display:none; align-items:center; justify-content:center; padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--paper); border-radius:22px; box-shadow:var(--shadow-hover); width:min(860px,100%); max-height:92vh; overflow:auto; animation:pop .28s cubic-bezier(.2,.9,.3,1.15); border:1px solid var(--line-soft);}
@keyframes pop{from{transform:translateY(14px) scale(.97); opacity:0;} to{transform:none; opacity:1;}}
.modal-h{position:sticky; top:0; display:flex; align-items:center; gap:10px; padding:16px 20px; background:var(--paper); border-bottom:1px solid var(--line-soft); z-index:2;}
.modal-h h3{margin:0; font-size:17px; color:var(--ink);}
.modal-x{margin-left:auto; width:34px;height:34px;border-radius:999px;background:var(--card-2);border:1px solid var(--line-soft);font-weight:700;font-size:15px;color:var(--ink-2);transition:.15s;}
.modal-x:hover{color:var(--berry); border-color:var(--berry-soft);}
.modal-b{padding:20px;}
.export-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px;}
.export-prev{border:1px solid var(--line-soft); border-radius:16px; background:#fff; padding:12px; min-height:220px; display:grid; place-items:center; overflow:auto;}
.export-prev canvas{max-width:100%; max-height:380px;}
.preview-mode{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px;}
.pm{padding:9px 4px; border-radius:999px; background:var(--card-2); border:1px solid var(--line-soft); font-size:11px; font-weight:700; text-align:center; color:var(--ink-2); transition:.15s;}
.pm:hover{color:var(--ink);}
.pm.active{background:var(--mint); color:#fff; border-color:var(--mint);}
.opt-row{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:13px; color:var(--ink);}
.switch{position:relative; width:44px; height:26px; flex:none;}
.switch input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.switch .knob{position:absolute; inset:0; border-radius:999px; background:#DDD3C2; transition:.2s;}
.switch .knob::after{content:""; position:absolute; top:3px; left:3px; width:20px;height:20px;border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.22); transition:.2s;}
.switch input:checked + .knob{background:var(--mint);}
.switch input:checked + .knob::after{left:21px;}
.export-buts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.step-badge{display:inline-flex; width:22px;height:22px;align-items:center;justify-content:center;border-radius:9px;background:var(--lemon);color:#6b5520;font-size:12px;font-weight:800;margin-right:8px;}

/* ---------- Toast ---------- */
#toastWrap{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow); animation:tin .3s cubic-bezier(.2,.9,.3,1.3); max-width:80vw;}
@keyframes tin{from{transform:translateY(-14px); opacity:0;} to{transform:none; opacity:1;}}

/* ---------- Print ---------- */
#printSheet{display:none;}
@media print{
  body{background:#fff; color:#333;}
  #app>*,.overlay,#toastWrap{display:none!important;}
  #printSheet{display:block;}
}

/* ---------- Responsive ---------- */
@media (max-width:1180px){ .wrap{grid-template-columns:240px minmax(0,1fr);} .panel-right{grid-column:1 / -1;} }
@media (max-width:760px){
  header{padding:10px 12px;} .brand small{display:none;}
  .hd-actions .hide-sm{display:none;}
  .wrap{grid-template-columns:1fr; gap:12px; padding:12px;}
  .panel-right{grid-column:auto;}
  .tool-grid{grid-template-columns:repeat(4,1fr);}
  .canvas-zone{min-height:300px; padding:14px;}
  #board{max-height:48vh;}
  .export-grid{grid-template-columns:1fr;}
  .swatches{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important; transition-duration:.01ms!important;}
}
</style>
</head>
<body>
<div id="app">

<header>
  <div class="brand">
    <div class="brand-logo"><i></i><i></i><i></i><i></i></div>
    <div><h1>拼豆工坊</h1><small>Perler · 会让你的手停不下来的小画板</small></div>
  </div>
  <div class="hd-actions">
    <button class="iconbtn hide-sm" id="btnUndo" title="撤销">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 1 1 0 11H11"/></svg>撤销</button>
    <button class="iconbtn hide-sm" id="btnRedo" title="重做">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 1 0 0 11H13"/></svg>重做</button>
    <button class="iconbtn" id="btnClear" title="清空画面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h4l1-2h8l1 2h4M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>清空</button>
    <div class="size-ctl"><span>尺寸</span>
      <label class="s-mini">列<input id="sizeCol" type="number" min="4" max="64" value="20" title="列数(宽)"></label>
      <span class="s-x">×</span>
      <label class="s-mini">行<input id="sizeRow" type="number" min="4" max="64" value="20" title="行数(高)"></label>
      <label class="s-mini" title="画布格子总数 = 列 × 行">豆<input id="sizeTotal" type="number" min="16" max="4096" value="400"></label>
    </div>
    <button class="iconbtn btn-export" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>一键导出</button>
  </div>
</header>

<div class="wrap">

  <!-- 左：工具 + 调色板 -->
  <aside class="panel">
    <div class="panel-h"><span class="dot" style="background:var(--teal)"></span>绘画工具</div>
    <div class="panel-b">
      <div class="tool-grid" id="toolGrid">
        <button class="tool active" data-tool="pen">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7a2.1 2.1 0 0 0-3-3l-7 7-1.5 4.5z"/></svg></span>画笔</button>
        <button class="tool" data-tool="eraser">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20l-5-1zM8 20l6-6"/></svg></span>橡皮</button>
        <button class="tool" data-tool="fill">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l8 8-6 6-8-8zM4 21h16M14 3l3-3 4 4-3 3"/></svg></span>填充</button>
        <button class="tool" data-tool="pick">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v3H6zM7 6l1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13"/></svg></span>吸色</button>
      </div>
      <div class="lbl" style="margin-top:14px">对称模式 · 画这里另一边也会跟着补全</div>
      <div class="sym-row" id="symRow">
        <button class="sym active" data-sym="none">关闭</button>
        <button class="sym" data-sym="h">左右对称</button>
        <button class="sym" data-sym="v">上下对称</button>
        <button class="sym" data-sym="c">中心对称</button>
      </div>
    </div>

<script>
/* ================= 数据 ================= */
const PALETTE = [
  {hex:'#FFFFFF',zh:'珍珠白',code:'001',grp:'基础'},
  {hex:'#E6E8EF',zh:'浅灰',code:'020',grp:'基础'},
  {hex:'#9BA3B0',zh:'石灰灰',code:'011',grp:'基础'},
  {hex:'#5A626E',zh:'深石板灰',code:'017',grp:'基础'},
  {hex:'#23262D',zh:'墨黑',code:'018',grp:'基础'},
  {hex:'#F5ECD9',zh:'奶油',code:'340',grp:'肤色中性'},
  {hex:'#F2C9A8',zh:'肤色',code:'913',grp:'肤色中性'},
  {hex:'#FFB3A0',zh:'蜜桃',code:'362',grp:'暖色'},
  {hex:'#FF9E8A',zh:'珊瑚',code:'365',grp:'暖色'},
  {hex:'#E6644A',zh:'陶土橙',code:'cc9',grp:'暖色'},
  {hex:'#E82F3B',zh:'正红',code:'060',grp:'暖色'},
  {hex:'#C1121F',zh:'大红',code:'063',grp:'暖色'},
  {hex:'#F26D9B',zh:'玫瑰粉',code:'529',grp:'粉色系'},
  {hex:'#FF86C0',zh:'樱花粉',code:'567',grp:'粉色系'},
  {hex:'#FF4D8F',zh:'桃红',code:'566',grp:'粉色系'},
  {hex:'#9C3E6B',zh:'酒红/梅紫',code:'585',grp:'粉色系'},
  {hex:'#F5821F',zh:'鲜橙',code:'024',grp:'暖色'},
  {hex:'#F0972C',zh:'琥珀橙',code:'025',grp:'暖色'},
  {hex:'#F2B441',zh:'金黄',code:'018',grp:'暖色'},
  {hex:'#FFCF40',zh:'柠檬黄',code:'019',grp:'暖色'},
  {hex:'#FCE9A0',zh:'米黄',code:'020',grp:'暖色'},
  {hex:'#3FA34D',zh:'草绿',code:'027',grp:'冷色'},
  {hex:'#5FB753',zh:'苹果绿',code:'026',grp:'冷色'},
  {hex:'#8FE3A8',zh:'薄荷绿',code:'042',grp:'冷色'},
  {hex:'#1F7A4F',zh:'深绿',code:'046',grp:'冷色'},
  {hex:'#2AA8A0',zh:'青碧',code:'034',grp:'冷色'},
  {hex:'#7FD6C2',zh:'湖水绿',code:'028',grp:'冷色'},
  {hex:'#6FD3F5',zh:'天蓝',code:'045',grp:'冷色'},
  {hex:'#3D7BE0',zh:'亮蓝',code:'014',grp:'冷色'},
  {hex:'#2950B0',zh:'藏蓝',code:'048',grp:'冷色'},
  {hex:'#9B5DE5',zh:'香芋紫',code:'035',grp:'冷色'},
  {hex:'#C77DFF',zh:'淡紫',code:'044',grp:'冷色'},
  {hex:'#6A2C8F',zh:'深紫',code:'036',grp:'冷色'},
  {hex:'#E4D3B2',zh:'米色',code:'339',grp:'肤色中性'},
  {hex:'#C98B4B',zh:'焦糖棕',code:'030',grp:'肤色中性'},
  {hex:'#8A5A36',zh:'可可棕',code:'033',grp:'肤色中性'},
  {hex:'#5C3A21',zh:'深咖',code:'031',grp:'肤色中性'},
].map((c,i)=>({...c,id:i}));

const GROUPS=['基础','肤色中性','暖色','粉色系','冷色'];

function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function nearestPalette(hex){
  const t=hex2rgb(hex); let best=0,bd=1e9;
  for(const c of PALETTE){const r=hex2rgb(c.hex);const d=(t[0]-r[0])**2+(t[1]-r[1])**2+(t[2]-r[2])**2;if(d<bd){bd=d;best=c.id;}}
  return PALETTE[best].hex;
}
const luc=hex=>{const[r,g,b]=hex2rgb(hex);return (0.299*r+0.587*g+0.114*b)/255;};

/* ================= 状态 ================= */
let HW=20, H=20, W=20;   // grid rows=H cols=W
let grid=[];              // H x W hex|null
let tool='pen', sym='none', cur=PALETTE[7].hex;
const undo=[]; const redo=[];

function makeGrid(h,w){return Array.from({length:h},()=>Array(w).fill(null));}
// 按列(宽)/行(高)重设画布：保留原内容居中
function applySize(nw,nh){
  nw=Math.max(4,Math.min(64,Math.round(+nw)||W));
  nh=Math.max(4,Math.min(64,Math.round(+nh)||H));
  const ng=makeGrid(nh,nw);
  if(grid.length){for(let y=0;y<Math.min(H,nh);y++){for(let x=0;x<Math.min(W,nw);x++){ng[y][x]=grid[y][x];}}}
  H=nh;W=nw;grid=ng;docSize();render();
}
// 按总豆(格子数=列×行)反推近似正方形尺寸
function dimsForTotal(t){
  t=Math.max(16,Math.min(4096,Math.round(+t)||400));
  const sq=Math.floor(Math.sqrt(t));
  const cols=Math.max(4,Math.min(64,sq));
  const rows=Math.max(4,Math.min(64,Math.round(t/cols)));
  return [cols,rows];
}

/* ================= 画布渲染 ================= */
const board=document.getElementById('board');
const boardCtx=board.getContext('2d');
const CELL=20;
function cellScale(){const target=board.clientWidth; return Math.max(8, Math.min(CELL, Math.floor(target/W)));}

function render(){
  const cs=cellScale();
  const pad=2;
  board.width=(W*cs+pad*2); board.height=(H*cs+pad*2);
  const g=boardCtx; g.clearRect(0,0,board.width,board.height);
  // 底
  board.style.width=board.width+'px'; board.style.height=board.height+'px';
  // 网格底
  g.fillStyle='#fff'; g.fillRect(0,0,board.width,board.height);
  g.strokeStyle='rgba(0,0,0,.05)'; g.lineWidth=1;
  for(let x=0;x<=W;x++){g.beginPath();g.moveTo(pad+x*cs+0.5,pad);g.lineTo(pad+x*cs+0.5,pad+H*cs);g.stroke();}
  for(let y=0;y<=H;y++){g.beginPath();g.moveTo(pad,y+pad+.5);g.lineTo(pad+W*cs,y+pad+.5);g.stroke();}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=grid[y][x]; if(!c)continue;
    const px=pad+x*cs, py=pad+y*cs;
    // 豆子造型
    const grad=g.createRadialGradient(px+cs*0.35,py+cs*0.3,cs*0.15,px+cs*0.5,py+cs*0.5,cs*0.78);
    grad.addColorStop(0,lighten(c,.18)); grad.addColorStop(1,darken(c,.16));
    g.fillStyle=grad;
    g.beginPath(); g.roundRect(px,py,cs,cs,2); g.fill();
    // 高光
    g.fillStyle='rgba(255,255,255,.28)';
    g.beginPath(); g.roundRect(px+cs*0.22,py+cs*0.16,cs*0.3,cs*0.18,2); g.fill();
  }
}
function lighten(hex,a){const[r,g,b]=hex2rgb(hex);return `rgb(${Math.round(r+(255-r)*a)},${Math.round(g+(255-g)*a)},${Math.round(b+(255-b)*a)})`;}
function darken(hex,a){const[r,g,b]=hex2rgb(hex);return `rgb(${Math.round(r*(1-a))},${Math.round(g*(1-a))},${Math.round(b*(1-a))})`;}

/* ================= 工具 ================= */
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  updateTip();}
function setSym(s){sym=s;document.querySelectorAll('.sym').forEach(b=>b.classList.toggle('active',b.dataset.sym===s));}
function updateTip(){
  const map={pen:'✏️ 点哪画哪，换个颜色继续',eraser:'🧽 把豆子擦掉，留出空白',fill:'🪣 点一下，同色连通区域全填充',pick:'💧 吸一个画面上已有的颜色'}
  document.getElementById('tipHint').textContent=map[tool];
}

// 坐标
function canvasPos(e){
  const r=board.getBoundingClientRect();
  const cs=cellScale(),pad=2;
  const sx=(e.clientX-r.left), sy=(e.clientY-r.top);
  const x=Math.floor((sx-pad)/cs), y=Math.floor((sy-pad)/cs);
  return {x,y};
}
function setCell(x,y,color){ if(x<0||y<0||x>=W||y>=H)return; grid[y][x]=color; }

function paint(x,y){
  if(tool==='eraser'){applySym(x,y,null);}
  else if(tool==='pen'){applySym(x,y,cur);}
  else if(tool==='fill'){doFill(x,y);return true;}
  render();
}
function applySym(x,y,color){
  setCell(x,y,color);
  if(sym==='h'){setCell(W-1-x,y,color);}
  else if(sym==='v'){setCell(x,H-1-y,color);}
  else if(sym==='c'){setCell(W-1-x,y,color);setCell(x,H-1-y,color);setCell(W-1-x,H-1-y,color);}
}
function doFill(x,y){
  const c0=grid[y]?.[x];
  if(c0===cur && tool==='pen')return;
  if(tool==='eraser'){ if(c0===null)return; }
  if(tool==='pen'){ if(c0===cur)return; }
  const target=c0, fillWith=tool==='eraser'?null:cur;
  const stack=[[x,y]]; const seen=new Set();
  while(stack.length){const[v,u]=stack.pop();const k=u*W+v;if(v<0||u<0||v>=W||u>=H||seen.has(k))continue;seen.add(k);
    if(grid[u][v]!==target)continue; grid[u][v]=fillWith;
    stack.push([v+1,u],[v-1,u],[v,u+1],[v,u-1]);
  }
  if(sym!=='none'){ /* 对称时再对称填充 —— 简化：整行填充后做一次对称复制 */}
  if(sym!=='none') applySymCopy();
}
function applySymCopy(){ // 把左侧/上部分复制到对称侧(对填充也生效)
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(sym==='h'&&x>W-1-x){grid[y][W-1-x]=grid[y][x];}
    if(sym==='v'&&y>H-1-y){grid[H-1-y][x]=grid[y][x];}
  }
}

function pushHist(){undo.push(grid.map(r=>r.slice())); if(undo.length>80)undo.shift(); redo.length=0;}
function undoStep(){if(!undo.length)return;redo.push(grid.map(r=>r.slice()));grid=undo.pop().map(r=>r.slice());syncHW();render();}
function redoStep(){if(!redo.length)return;undo.push(grid.map(r=>r.slice()));grid=redo.pop().map(r=>r.slice());syncHW();render();}
function syncHW(){H=grid.length;W=grid[0].length;docSize();}

// 画布交互
let drawing=false;
board.addEventListener('pointerdown',e=>{e.preventDefault();board.setPointerCapture(e.pointerId);pushHist();drawing=true;const{x,y}=canvasPos(e);paint(x,y);});
board.addEventListener('pointermove',e=>{if(!drawing)return;const{x,y}=canvasPos(e);paint(x,y);});
board.addEventListener('pointerup',()=>{drawing=false;updateInfo();});board.addEventListener('pointercancel',()=>{drawing=false;});
// 画布手里拿起颜色
board.addEventListener('contextmenu',e=>{e.preventDefault();const{x,y}=canvasPos(e);if(grid[y]?.[x])pickColor(grid[y][x]);});

/* ================= 调色板 ================= */
function renderPalette(){
  const pal=document.getElementById('palette');
  pal.innerHTML='';
  for(const grp of GROUPS){
    const items=PALETTE.filter(c=>c.grp===grp); if(!items.length)continue;
    const wrap=document.createElement('div');wrap.className='pal-grp';
    const h=document.createElement('h4');h.textContent=grp;wrap.appendChild(h);
    const sw=document.createElement('div');sw.className='swatches';
    items.forEach(c=>{
      const d=document.createElement('button');d.className='sw';d.dataset.hex=c.hex;
      d.style.background=c.hex;
      const code=document.createElement('span');code.className='sw-code';
      code.textContent=c.code;code.style.color=luc(c.hex)>0.6?'#000':'#fff';
      d.appendChild(code);
      d.onclick=()=>pickColor(c.hex);
      sw.appendChild(d);
    });
    wrap.appendChild(sw);pal.appendChild(wrap);
  }
}
function pickColor(hex){
  cur=hex;
  const c=PALETTE.find(p=>p.hex===hex);
  document.getElementById('curSwatch').style.background=hex;
  document.getElementById('curName').textContent=c?c.zh:'自定义';
  document.getElementById('curCode').textContent=c?c.code:'--';
  document.getElementById('curHex').textContent=hex.replace('#','');
  document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('selected',s.dataset.hex===hex));
  if(tool!=='pen')setTool('pen');
}

/* ================= 信息 ================= */
function updateInfo(){
  let colors=0,beads=0;const set=new Set();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(grid[y][x]){beads++;set.add(grid[y][x]);}}
  document.getElementById('infoSize').textContent=W+'×'+H;
  document.getElementById('infoColors').textContent=set.size;
  document.getElementById('infoBeads').textContent=beads;
}

/* ================= 模板库（设计原图） ================= */
let tplCat='动物';
function renderTplCats(){const c=document.getElementById('tplCats');c.innerHTML='';
  Object.keys(DESIGNS).forEach(k=>{const b=document.createElement('button');b.className='cat-chip'+(k===tplCat?' active':'');b.textContent=k;
    b.onclick=()=>{tplCat=k;renderTplCats();renderTplGrid();};c.appendChild(b);});}
function renderTplGrid(){
  const gridEl=document.getElementById('tplGrid');gridEl.innerHTML='';
  (DESIGNS[tplCat]||[]).forEach(t=>{
    const wrap=document.createElement('div');wrap.className='tpl';
    const im=document.createElement('img');im.src=DESIGN_DIR+t.key+'.jpg';im.alt=t.name;im.loading='lazy';
    const nm=document.createElement('div');nm.className='tname';nm.textContent=t.name;
    wrap.appendChild(im);wrap.appendChild(nm);

function applyDesign(url){

    const v=22;

    const ng=makeGrid(v,v); H=W=v; grid=ng;
    docSize();

    const g=c.getContext('2d');
    g.fillStyle='#FFFFFF';g.fillRect(0,0,v,v);
    const iw=img.width,ih=img.height,s=Math.max(v/iw,v/ih),sw=iw*s,sh=ih*s;
    g.drawImage(img,(v-sw)/2,(v-sh)/2,sw,sh);
    const data=g.getImageData(0,0,v,v).data;
    for(let y=0;y<v;y++)for(let x=0;x<v;x++){
      const i=(y*v+x)*4,a=data[i+3];
      if(a<150){grid[y][x]=null;continue;}
      grid[y][x]=nearestPalette(toHex(data[i],data[i+1],data[i+2]));
    }
    render();updateInfo();
  };
  img.onerror=()=>toast('设计图加载失败',1);
  img.src=url;
}

let playMode='rainbow';
const RAINBOW=['#E82F3B','#F5821F','#FFCF40','#3FA34D','#3D7BE0','#9B5DE5'];
document.querySelectorAll('#playMode button').forEach(b=>b.onclick=()=>{playMode=b.dataset.p;document.querySelectorAll('#playMode button').forEach(x=>x.classList.toggle('active',x===b));});

function genPlay(){
  H=guessSquare(); W=H; grid=makeGrid(H,W); syncSize();
  if(playMode==='rainbow'){for(let y=0;y<H;y++){const col=RAINBOW[Math.floor(y/H*RAINBOW.length)];const light=Math.random()<.5;for(let x=0;x<W;x++)grid[y][x]=shadeVar(col,0.12);}}
  else if(playMode==='grad'){const a=randPal(),b=randPal();for(let y=0;y<H;y++)for(let x=0;x<W;x++){grid[y][x]=lerpPal(a,b,(x+y)/(W+H));}}
  else if(playMode==='dots'){const bg=randPal(),fg=randPal();for(let y=0;y<H;y++)for(let x=0;x<W;x++)grid[y][x]=((x%3===1&&y%3===1)||(x%3===2&&y%3===2))?fg:bg;}
  else if(playMode==='stripe'){const a=randPal(),b=randPal();const th=2+Math.floor(Math.random()*2);for(let y=0;y<H;y++)for(let x=0;x<W;x++)grid[y][x]=(Math.floor((Math.random()<.5?x:y)/th)%2===0)?a:b;}
  else if(playMode==='check'){const a=randPal(),b=randPal();for(let y=0;y<H;y++)for(let x=0;x<W;x++)grid[y][x]=((x+(Math.random()<.5?y:0))%2===0)?a:b;}
  else if(playMode==='star'){for(let y=0;y<H;y++){grid[y]=Array(W).fill('#23262D');if(Math.random()<.5)grid[y][Math.floor(Math.random()*W)]='#FFCF40';}const big=(0|Math.random()*W),bby=(0|Math.random()*H);grid[bby][big]='#FFFFFF';}
}
function randPal(){return PALETTE[Math.floor(Math.random()*PALETTE.length)].hex;}
function shadeVar(hex,a){const[r,g,b]=hex2rgb(hex);const f=a*(Math.random()-.5)*2;return `#${[r,g,b].map(v=>(0|Math.min(255,Math.max(0,v+v*f))).toString(16).padStart(2,'0')).join('')}`;}
function lerpPal(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return '#000'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('');}
function guessSquare(){const opts=[12,16,20,24,28,32];return opts[Math.floor(Math.random()*opts.length)];}

function genText(txt){
  const fh=7,gap=1,bm=1,border=1;
  const elems=txt.split('').map(ch=>{const glyph=FONT[ch];return glyph?glyph.map(r=>r.split('').map(c=>c==='1')):null;}).filter(Boolean);
  if(!elems.length)return;
  const chw=5;
  const w=elems.reduce((s)=>s+chw,0)+gap*(elems.length-1)+bm*2;
  const h=fh+bm*2+ (border?2:0);
  grid=Array.from({length:h},()=>Array(w).fill(null));
  H=h;W=w;syncSize();
  const main=txtColor;
  const edge=luc(main)>0.6?'#23262D':'#FFFFFF';
  let x=bm;
  for(const glyph of elems){
    for(let gy=0;gy<fh;gy++)for(let gx=0;gx<chw;gx++){
      const y=gy+bm;
      if(!glyph[gy]||glyph[gy][gx]===undefined||!glyph[gy][gx])continue;
      grid[y+ (border?1:0)][x+gx]=main;
      if(border){if(y===bm)grid[y][x+gx]=edge; if(y===fh+bm-1)grid[y][x+gx]=edge; if(gx===0)grid[y+ (border?1:0)][x+gx]=edge; if(gx===chw-1)grid[y+ (border?1:0)][x+gx]=edge;}
    }
    x+=chw+gap;
  }
}

function usedColors(){const map=new Map();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c)map.set(c,(map.get(c)||0)+1);}return map;}
function padPal(hex){for(const p of PALETTE)if(p.hex.toLowerCase()===hex.toLowerCase())return p;return {hex,zh:'#',code:'--'};}

function drawArt(g,cell,nohiline){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(!c)continue;
    const px=x*cell,py=y*cell;
    if(nohiline){g.fillStyle=c;g.beginPath();g.roundRect(px,py,cell,cell,cell*0.12);g.fill();}
    else{
      const gr=g.createRadialGradient(px+cell*0.35,py+cell*0.3,cell*0.12,px+cell*0.5,py+cell*0.5,cell*0.85);
      gr.addColorStop(0,lighten(c,.2));gr.addColorStop(1,darken(c,.22));
      g.fillStyle=gr;g.beginPath();g.roundRect(px,py,cell,cell,cell*0.12);g.fill();
      g.fillStyle='rgba(255,255,255,.3)';g.beginPath();g.roundRect(px+cell*0.24,py+cell*0.16,cell*0.26,cell*0.14,cell*0.07);g.fill();
    }
  }
}
function makeCanvas(beadSize,px,py){
  const cv=document.createElement('canvas');cv.width=px||W*beadSize;cv.height=py||H*beadSize;return cv;
}
function renderExport(){
  const cv=document.createElement('canvas');const pad=6, bead=18;
  if(exportMode==='list'){return renderList();}
  const used=usedColors();
  const px=W*bead+pad*2, py=H*bead+pad*2;
  cv.width=px;cv.height=py;const g=cv.getContext('2d');
  // 背景
  if(exportBg==='white'){g.fillStyle='#ffffff';g.fillRect(0,0,px,py);}
  else if(exportBg==='board'){g.fillStyle='#F3D9AF';g.fillRect(0,0,px,py);}
  // 内容
  g.save();g.translate(pad,pad);
  if(exportMode==='sheet'){ // 图纸
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];
      if(c){const pp=padPal(c);
        g.fillStyle=exportBg==='board'?mixBg(c,'#F3D9AF') : mixBg(c,'#fff');
        g.fillRect(x*bead,y*bead,bead,bead);
      }
    }
    if(gridOn){g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1;
      const ep=new Path2D();for(let x=0;x<=W;x++){ep.moveTo(x*bead+0.5,0);ep.lineTo(x*bead+0.5,H*bead);}
      for(let y=0;y<=H;y++){ep.moveTo(0,y*bead+0.5);ep.lineTo(W*bead,y*bead+0.5);}
      g.stroke(ep);}
    if(codeOn){g.font=`bold ${Math.max(5,Math.floor(bead*0.36))}px system-ui`;g.textAlign='left';g.textBaseline='top';
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(!c)continue;const pp=padPal(c);
        g.fillStyle=luc(c)>0.55?'#000':'#fff';
        g.fillText(pp.code,x*bead+2,y*bead+2);}}
  } else { // art / 3d
    if(exportMode==='art')drawArt(g,bead,true);
    else drawArt(g,bead,false);
  }
  g.restore();
  return cv;
}
function mixBg(hex,bg){const[h0]=hex2rgb(hex),[h1]=hex2rgb(bg);return `rgb(${Math.round((h0[0]+h1[0])/2)},${Math.round((h0[1]+h1[1])/2)},${Math.round((h0[2]+h1[2])/2)})`;}

    g.fillStyle=p.hex;g.fillRect(46,y+4,rowh-16,rowh-16);
    g.fillStyle='#4A3B32';g.font='600 13px system-ui';
    g.fillText(p.zh+'  |  色号 '+p.code+'  |  #'+p.hex.replace('#',''), 70, y+12);
    g.fillText('× '+n, 40+(w-80)-60, y+12);
    y+=rowh;
  });
  return cv;
}
function refreshPrev(){const cv=renderExport();const pv=document.getElementById('exportPrev');
  pv.width=cv.width;pv.height=cv.height;
  const tg=pv.getContext('2d');tg.clearRect(0,0,pv.width,pv.height);tg.scale(pv.width/cv.width,pv.height/cv.height);tg.drawImage(cv,0,0);
  const info=usedColors().size+' 种颜色 · '+([...usedColors().values()].reduce((a,b)=>a+b,0))+' 颗豆';
  const si=document.getElementById('sheetInfo');si.textContent=info;
}
function downloadPNG(){
  const cv=renderExport();
  const a=document.createElement('a');a.download='拼豆_'+(W+'×'+H)+'_'+Date.now()+'.png';a.href=cv.toDataURL('image/png');a.click();
  closeExport();toast('已下载 🎉');
}
document.getElementById('btnDownload').onclick=downloadPNG;
document.getElementById('btnPrint').onclick=()=>{
  const cv=renderExport();
  const ps=document.getElementById('printSheet');ps.innerHTML='';
  ps.style.padding='24px';ps.style.fontFamily='system-ui';
  const im=document.createElement('img');im.src=cv.toDataURL('image/png');im.style.width=Math.min(820,cv.width*1)+'px';ps.appendChild(im);
  window.print();
};
function listText(){
  const used=usedColors();const entries=[...used.entries()].sort((a,b)=>PALETTE.findIndex(p=>p.hex===a[0])-PALETTE.findIndex(p=>p.hex===b[0]));
  let t='🪲 拼豆色号清单（'+W+'×'+H+'）\n\n';
  entries.forEach(([hex,n])=>{const p=padPal(hex);t+=`${p.code}\t${p.zh}\t#${p.hex.replace('#','')}\t× ${n}\n`;});
  const total=[...used.values()].reduce((a,b)=>a+b,0);t+='\n合计：'+total+' 颗豆';
  return t;
}
document.getElementById('btnCopyList').onclick=async()=>{try{await navigator.clipboard.writeText(listText());toast('色号清单已复制 📋');}catch(e){toast('复制失败，试试下载PNG',1);}};

/* ================= 旋转/翻转 ================= */
document.getElementById('btnRot').onclick=()=>{pushHist();rotateCW();render();updateInfo();};
document.getElementById('btnFlipH').onclick=()=>{pushHist();flipH();render();updateInfo();};
function rotateCW(){const ng=makeGrid(W,H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ng[x][H-1-y]=grid[y][x];}grid=ng;const t=H;H=W;W=t;docSize();}
function flipH(){for(let y=0;y<H;y++){grid[y].reverse();}}

/* ================= 初始化 ================= */
function syncSize(){docSize();}
function toast(msg,err){const w=document.createElement('div');w.className='toast';w.style.background=err?'#C6442F':'var(--ink)';w.textContent=msg;document.getElementById('toastWrap').appendChild(w);setTimeout(()=>{w.style.opacity='0';w.style.transition='.4s';setTimeout(()=>w.remove(),400);},2000);}
document.getElementById('btnUndo').onclick=undoStep;document.getElementById('btnUndo2').onclick=undoStep;
document.getElementById('btnRedo').onclick=redoStep;document.getElementById('btnRedo2').onclick=redoStep;
document.getElementById('btnClear').onclick=()=>{if(!grid.some(r=>r.some(Boolean)))return toast('已经是空的了~',1);pushHist();grid=makeGrid(H,W);render();updateInfo();toast('画布已清空 🧹');};
document.getElementById('btnSave').onclick=saveWork;document.getElementById('btnSave2').onclick=saveWork;
document.getElementById('sizeCol').onchange=e=>{pushHist();applySize(+e.target.value||W,H);updateInfo();};
document.getElementById('sizeRow').onchange=e=>{pushHist();applySize(W,+e.target.value||H);updateInfo();};
document.getElementById('sizeTotal').onchange=e=>{pushHist();const d=dimsForTotal(+e.target.value);applySize(d[0],d[1]);updateInfo();};
document.querySelectorAll('#toolGrid .tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('#symRow .sym').forEach(b=>b.onclick=()=>setSym(b.dataset.sym));
// tabs
document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.tabbody').forEach(x=>x.classList.toggle('active',x.id==='tab-'+b.dataset.tab));
});

// 初始
grid=makeGrid(H,W);
applySize(20,20);
pickColor(PALETTE[7].hex);
setTool('pen');
renderPalette();renderTplCats();renderTplGrid();renderEmoCats();renderEmojiGrid();renderTxtColors();renderMine();
updateInfo();
</script>
</body>
